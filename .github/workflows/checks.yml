name: Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    # This job name is a required check; do not change it without updating the Main ruleset.
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install
      - run: bun run verify:checks
