name: Production migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Supabase migrations
    if: github.ref == 'refs/heads/main'
    environment: production-migrations
    concurrency:
      group: production-supabase-migrations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Resolves the exact CLI version from the root bun.lock.
      - uses: supabase/setup-cli@v3

      - name: Link and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Missing SUPABASE_DB_PASSWORD}"
          : "${SUPABASE_PROJECT_REF:?Missing SUPABASE_PROJECT_REF}"
          supabase link "$SUPABASE_PROJECT_REF" --yes
          supabase db push --remote --yes --skip-vault
