name: Production migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Supabase migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - name: Read pinned CLI version
        id: cli
        run: bun -e 'console.log(`version=${JSON.parse(await Bun.file("package.json").text()).devDependencies.supabase}`)' >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Link and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Missing SUPABASE_DB_PASSWORD}"
          : "${SUPABASE_PROJECT_REF:?Missing SUPABASE_PROJECT_REF}"
          supabase link "$SUPABASE_PROJECT_REF" --yes
          supabase db push --remote --yes --skip-vault
