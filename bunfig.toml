[fmt]
ignorePatterns = ["dist/**", "*.min.js"]

[fmt.sortImports]
newlinesBetween = false
groups = [
  "type-import",
  [
    "value-builtin",
    "value-external",
  ],
  "type-internal",
  "value-internal",
  [
    "type-parent",
    "type-sibling",
    "type-index",
  ],
  [
    "value-parent",
    "value-sibling",
    "value-index",
  ],
  "unknown",
]

[fmt.sortTailwindcss]
stylesheet = "./src/app/globals.css"
functions = ["clsx", "cn"]
preserveWhitespace = true

[fmt.sortPackageJson]
sortScripts = true
